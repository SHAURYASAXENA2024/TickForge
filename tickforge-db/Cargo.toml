[package]
name = "tickforge_db"
version = "0.1.0"
edition = "2021"
crate-type = ["cdylib", "rlib"]

[lib]
name = "tickforge_db"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3   = { version = "0.21", features = ["extension-module"] }
serde  = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tempfile = "3"
